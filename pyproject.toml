[project]
name = "knittingchart"
version = "0.1.0"
description = "Convert knitting chart PDFs to interactive standalone HTML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "mikkvais" }]
dependencies = [
    "pymupdf",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
knittingchart = "knittingchart.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
